name: Deploy RPagentOS Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  deployments: write

jobs:
  deploy:
    name: Build and deploy web app
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            apps/web/package-lock.json

      - name: Install root dependencies
        run: npm ci

      - name: Install web dependencies
        run: npm ci --prefix apps/web

      - name: Typecheck
        run: npm run typecheck:all

      - name: Build web app
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
        run: npm run web:build

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy apps/web/dist --project-name rpagentos --branch main

      # Direct Pages deployments may refresh the production deployment config.
      # Update all secrets atomically afterward so concurrent config deployments
      # cannot finish out of order and leave production with a partial snapshot.
      - name: Synchronize production API tokens
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          ORDERMGMT_CATALOG_API_TOKEN: ${{ secrets.ORDERMGMT_CATALOG_API_TOKEN }}
          LISTING_COPY_INTERNAL_API_TOKEN: ${{ secrets.LISTING_COPY_INTERNAL_API_TOKEN }}
          CATALOG_OWNER_API_TOKEN: ${{ secrets.CATALOG_OWNER_API_TOKEN }}
          CATALOGSYNC_RELAY_SECRET: ${{ secrets.CATALOGSYNC_RELAY_SECRET }}
          CATALOGSYNC_RELAY_URL: ${{ vars.CATALOGSYNC_RELAY_URL }}
        run: |
          for SECRET_NAME in ORDERMGMT_CATALOG_API_TOKEN LISTING_COPY_INTERNAL_API_TOKEN CATALOG_OWNER_API_TOKEN CATALOGSYNC_RELAY_SECRET CATALOGSYNC_RELAY_URL; do
            if [ -z "${!SECRET_NAME}" ]; then
              echo "::error::$SECRET_NAME is not configured"
              exit 1
            fi
          done
          node -e "process.stdout.write(JSON.stringify({ ORDERMGMT_CATALOG_API_TOKEN: process.env.ORDERMGMT_CATALOG_API_TOKEN, INTERNAL_CATALOG_API_TOKEN: process.env.LISTING_COPY_INTERNAL_API_TOKEN, CATALOGSYNC_PIPELINE_API_TOKEN: process.env.CATALOG_OWNER_API_TOKEN, CATALOGSYNC_RELAY_SECRET: process.env.CATALOGSYNC_RELAY_SECRET, CATALOGSYNC_RELAY_URL: process.env.CATALOGSYNC_RELAY_URL }))" \
            | npx --yes wrangler@4.80.0 pages secret bulk \
                --project-name rpagentos

      - name: Remove retired account metrics token
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if npx --yes wrangler@4.80.0 pages secret list --project-name rpagentos \
            | grep -q 'ACCOUNT_METRICS_API_TOKEN'; then
            printf 'y\n' \
              | npx --yes wrangler@4.80.0 pages secret delete ACCOUNT_METRICS_API_TOKEN \
                  --project-name rpagentos
          else
            echo "Retired account metrics token is already absent"
          fi

      - name: Verify OrderMgmt catalog credential
        env:
          ORDERMGMT_CATALOG_API_TOKEN: ${{ secrets.ORDERMGMT_CATALOG_API_TOKEN }}
        run: |
          STATUS=""
          for ATTEMPT in 1 2 3 4 5; do
            STATUS=$(curl -sS -o /tmp/catalog-smoke.json -w '%{http_code}' \
              -H "Authorization: Bearer $ORDERMGMT_CATALOG_API_TOKEN" \
              'https://rpagentos.pages.dev/api/internal/catalog/sku/__ordermgmt_deploy_smoke_missing__')
            if [ "$STATUS" = "404" ]; then
              echo "✅ OrderMgmt catalog credential accepted by production"
              exit 0
            fi
            echo "Attempt $ATTEMPT/5 returned HTTP $STATUS; retrying"
            sleep 3
          done
          echo "::error::OrderMgmt catalog credential smoke failed (expected authenticated 404, got $STATUS)"
          exit 1

      - name: Verify listing copy internal API credential
        env:
          LISTING_COPY_INTERNAL_API_TOKEN: ${{ secrets.LISTING_COPY_INTERNAL_API_TOKEN }}
        run: |
          STATUS=""
          for ATTEMPT in 1 2 3 4 5; do
            STATUS=$(curl -sS -o /tmp/listing-copy-smoke.json -w '%{http_code}' \
              -X PATCH \
              -H "Authorization: Bearer $LISTING_COPY_INTERNAL_API_TOKEN" \
              -H 'Content-Type: application/json' \
              --data '{}' \
              'https://rpagentos.pages.dev/api/internal/catalog/listings/not-a-uuid/content')
            if [ "$STATUS" = "400" ]; then
              echo "Listing copy internal credential accepted by production"
              exit 0
            fi
            echo "Attempt $ATTEMPT/5 returned HTTP $STATUS; retrying"
            sleep 3
          done
          echo "::error::Listing copy credential smoke failed (expected authenticated 400, got $STATUS)"
          exit 1

      - name: Verify public account metrics endpoint
        run: |
          STATUS=""
          for ATTEMPT in 1 2 3 4 5; do
            STATUS=$(curl -sS -o /tmp/account-metrics-smoke.json -w '%{http_code}' \
              'https://rpagentos.pages.dev/api/account-metrics?platform=mercari&shop_code=shop4')
            if [ "$STATUS" = "200" ]; then
              echo "Account metrics endpoint available in production"
              exit 0
            fi
            echo "Attempt $ATTEMPT/5 returned HTTP $STATUS; retrying"
            sleep 3
          done
          echo "::error::Account metrics smoke failed (expected 200, got $STATUS)"
          exit 1
