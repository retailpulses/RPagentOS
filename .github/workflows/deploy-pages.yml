name: Deploy RPagentOS Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  deployments: write

jobs:
  deploy:
    name: Build and deploy web app
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            apps/web/package-lock.json

      - name: Install root dependencies
        run: npm ci

      - name: Install web dependencies
        run: npm ci --prefix apps/web

      - name: Typecheck
        run: npm run typecheck:all

      - name: Build web app
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
        run: npm run web:build

      - name: Synchronize OrderMgmt catalog API token
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          ORDERMGMT_CATALOG_API_TOKEN: ${{ secrets.ORDERMGMT_CATALOG_API_TOKEN }}
        run: |
          if [ -z "$ORDERMGMT_CATALOG_API_TOKEN" ]; then
            echo "::error::ORDERMGMT_CATALOG_API_TOKEN is not configured"
            exit 1
          fi
          # Wrangler reads the secret as an interactive line. Terminate stdin
          # with one newline; Wrangler strips the delimiter from the value.
          printf '%s\n' "$ORDERMGMT_CATALOG_API_TOKEN" \
            | npx --yes wrangler@4.80.0 pages secret put ORDERMGMT_CATALOG_API_TOKEN \
                --project-name rpagentos

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy apps/web/dist --project-name rpagentos --branch main

      - name: Verify OrderMgmt catalog credential
        env:
          ORDERMGMT_CATALOG_API_TOKEN: ${{ secrets.ORDERMGMT_CATALOG_API_TOKEN }}
        run: |
          STATUS=""
          for ATTEMPT in 1 2 3 4 5; do
            STATUS=$(curl -sS -o /tmp/catalog-smoke.json -w '%{http_code}' \
              -H "Authorization: Bearer $ORDERMGMT_CATALOG_API_TOKEN" \
              'https://rpagentos.pages.dev/api/internal/catalog/sku/__ordermgmt_deploy_smoke_missing__')
            if [ "$STATUS" = "404" ]; then
              echo "✅ OrderMgmt catalog credential accepted by production"
              exit 0
            fi
            echo "Attempt $ATTEMPT/5 returned HTTP $STATUS; retrying"
            sleep 3
          done
          echo "::error::OrderMgmt catalog credential smoke failed (expected authenticated 404, got $STATUS)"
          exit 1
