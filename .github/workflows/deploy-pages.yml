name: Deploy RPagentOS Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  deployments: write

jobs:
  deploy:
    name: Build and deploy web app
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            apps/web/package-lock.json

      - name: Install root dependencies
        run: npm ci

      - name: Install web dependencies
        run: npm ci --prefix apps/web

      - name: Typecheck
        run: npm run typecheck:all

      - name: Build web app
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
        run: npm run web:build

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy apps/web/dist --project-name rpagentos --branch main

      # Direct Pages deployments may refresh the production deployment config,
      # so synchronize the secret after the deployment has been created.
      - name: Synchronize OrderMgmt catalog API token
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          ORDERMGMT_CATALOG_API_TOKEN: ${{ secrets.ORDERMGMT_CATALOG_API_TOKEN }}
        run: |
          if [ -z "$ORDERMGMT_CATALOG_API_TOKEN" ]; then
            echo "::error::ORDERMGMT_CATALOG_API_TOKEN is not configured"
            exit 1
          fi
          printf '%s\n' "$ORDERMGMT_CATALOG_API_TOKEN" \
            | npx --yes wrangler@4.80.0 pages secret put ORDERMGMT_CATALOG_API_TOKEN \
                --project-name rpagentos

      - name: Synchronize listing copy internal API token
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          LISTING_COPY_INTERNAL_API_TOKEN: ${{ secrets.LISTING_COPY_INTERNAL_API_TOKEN }}
        run: |
          if [ -z "$LISTING_COPY_INTERNAL_API_TOKEN" ]; then
            echo "::error::LISTING_COPY_INTERNAL_API_TOKEN is not configured"
            exit 1
          fi
          printf '%s\n' "$LISTING_COPY_INTERNAL_API_TOKEN" \
            | npx --yes wrangler@4.80.0 pages secret put INTERNAL_CATALOG_API_TOKEN \
                --project-name rpagentos

      - name: Synchronize account metrics manager token
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          ACCOUNT_METRICS_API_TOKEN: ${{ secrets.ACCOUNT_METRICS_API_TOKEN }}
        run: |
          if [ -z "$ACCOUNT_METRICS_API_TOKEN" ]; then
            echo "::error::ACCOUNT_METRICS_API_TOKEN is not configured"
            exit 1
          fi
          printf '%s\n' "$ACCOUNT_METRICS_API_TOKEN" \
            | npx --yes wrangler@4.80.0 pages secret put ACCOUNT_METRICS_API_TOKEN \
                --project-name rpagentos

      - name: Verify OrderMgmt catalog credential
        env:
          ORDERMGMT_CATALOG_API_TOKEN: ${{ secrets.ORDERMGMT_CATALOG_API_TOKEN }}
        run: |
          STATUS=""
          for ATTEMPT in 1 2 3 4 5; do
            STATUS=$(curl -sS -o /tmp/catalog-smoke.json -w '%{http_code}' \
              -H "Authorization: Bearer $ORDERMGMT_CATALOG_API_TOKEN" \
              'https://rpagentos.pages.dev/api/internal/catalog/sku/__ordermgmt_deploy_smoke_missing__')
            if [ "$STATUS" = "404" ]; then
              echo "✅ OrderMgmt catalog credential accepted by production"
              exit 0
            fi
            echo "Attempt $ATTEMPT/5 returned HTTP $STATUS; retrying"
            sleep 3
          done
          echo "::error::OrderMgmt catalog credential smoke failed (expected authenticated 404, got $STATUS)"
          exit 1

      - name: Verify listing copy internal API credential
        env:
          LISTING_COPY_INTERNAL_API_TOKEN: ${{ secrets.LISTING_COPY_INTERNAL_API_TOKEN }}
        run: |
          STATUS=""
          for ATTEMPT in 1 2 3 4 5; do
            STATUS=$(curl -sS -o /tmp/listing-copy-smoke.json -w '%{http_code}' \
              -X PATCH \
              -H "Authorization: Bearer $LISTING_COPY_INTERNAL_API_TOKEN" \
              -H 'Content-Type: application/json' \
              --data '{}' \
              'https://rpagentos.pages.dev/api/internal/catalog/listings/not-a-uuid/content')
            if [ "$STATUS" = "400" ]; then
              echo "Listing copy internal credential accepted by production"
              exit 0
            fi
            echo "Attempt $ATTEMPT/5 returned HTTP $STATUS; retrying"
            sleep 3
          done
          echo "::error::Listing copy credential smoke failed (expected authenticated 400, got $STATUS)"
          exit 1

      - name: Verify account metrics manager credential
        env:
          ACCOUNT_METRICS_API_TOKEN: ${{ secrets.ACCOUNT_METRICS_API_TOKEN }}
        run: |
          STATUS=""
          for ATTEMPT in 1 2 3 4 5; do
            STATUS=$(curl -sS -o /tmp/account-metrics-smoke.json -w '%{http_code}' \
              -H "Authorization: Bearer $ACCOUNT_METRICS_API_TOKEN" \
              'https://rpagentos.pages.dev/api/account-metrics?platform=mercari&shop_code=shop4')
            if [ "$STATUS" = "200" ]; then
              echo "Account metrics credential accepted by production"
              exit 0
            fi
            echo "Attempt $ATTEMPT/5 returned HTTP $STATUS; retrying"
            sleep 3
          done
          echo "::error::Account metrics credential smoke failed (expected 200, got $STATUS)"
          exit 1
