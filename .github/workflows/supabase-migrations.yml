name: Deploy Supabase Migrations

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Print pending migrations without applying them"
        required: true
        default: "true"
        type: choice
        options:
          - "true"
          - "false"
      repair_versions:
        description: "Optional space-separated migration versions to repair before push"
        required: false
        default: ""
      repair_status:
        description: "Status to set for repaired versions"
        required: true
        default: "reverted"
        type: choice
        options:
          - "reverted"
          - "applied"

permissions:
  contents: read

jobs:
  migrate:
    name: Supabase migration deploy
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate migration secrets
        run: |
          test -n "$SUPABASE_ACCESS_TOKEN"
          test -n "$SUPABASE_PROJECT_REF"
          test -n "$SUPABASE_DB_PASSWORD"

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: 2.109.1

      - name: Link exact Supabase project
        run: |
          supabase link \
            --project-ref "$SUPABASE_PROJECT_REF" \
            --password "$SUPABASE_DB_PASSWORD" \
            --yes

      - name: Show migration history
        run: supabase migration list --linked --password "$SUPABASE_DB_PASSWORD"

      - name: Repair migration history
        if: ${{ inputs.repair_versions != '' }}
        env:
          REPAIR_VERSIONS: ${{ inputs.repair_versions }}
          REPAIR_STATUS: ${{ inputs.repair_status }}
        run: |
          if ! [[ "$REPAIR_VERSIONS" =~ ^[0-9[:space:]]+$ ]]; then
            echo "repair_versions must be a space-separated list of numeric migration versions"
            exit 1
          fi
          read -r -a versions <<< "$REPAIR_VERSIONS"
          supabase migration repair \
            --linked \
            --password "$SUPABASE_DB_PASSWORD" \
            --status "$REPAIR_STATUS" \
            "${versions[@]}"

      - name: Show migration history after repair
        if: ${{ inputs.repair_versions != '' }}
        run: supabase migration list --linked --password "$SUPABASE_DB_PASSWORD"

      - name: Dry-run migration push
        if: ${{ inputs.dry_run == 'true' }}
        run: supabase db push --linked --password "$SUPABASE_DB_PASSWORD" --include-all --dry-run

      - name: Apply migrations
        if: ${{ inputs.dry_run == 'false' }}
        run: supabase db push --linked --password "$SUPABASE_DB_PASSWORD" --include-all

      - name: Verify no pending migrations
        if: ${{ inputs.dry_run == 'false' }}
        run: supabase db push --linked --password "$SUPABASE_DB_PASSWORD" --include-all --dry-run
