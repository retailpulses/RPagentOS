# Governance Checks — calls the central reusable workflow from rp-governance-kit
# See: https://github.com/retailpulses/rp-governance-kit
name: Governance Checks

on:
  pull_request:
    branches:
      - main

concurrency:
  group: governance-${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  governance:
    uses: retailpulses/rp-governance-kit/.github/workflows/governance-checks.yml@12056e83066536fff6804209f049f6de4b107081
