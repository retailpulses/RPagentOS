name: Rakuten DeepSeek Copy Live Loop

on:
  schedule:
    - cron: "17 */2 * * *"
  workflow_dispatch:
    inputs:
      mode:
        description: "dry_run only evaluates; auto may update one safe canonical listing"
        required: true
        type: choice
        options: [dry_run, auto]
        default: dry_run
      limit:
        description: "Bounded batch size (1-5)"
        required: true
        default: "1"

permissions:
  contents: read

concurrency:
  group: rakuten-deepseek-copy-live-loop
  cancel-in-progress: false

jobs:
  run-loop:
    name: Select, enrich, safety-check, and optionally apply
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
      DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
      INTERNAL_CATALOG_API_URL: https://rpagentos.pages.dev/api/internal/catalog
      INTERNAL_CATALOG_API_TOKEN: ${{ secrets.LISTING_COPY_INTERNAL_API_TOKEN }}
      COPY_IMPROVEMENT_AUTO_SHOPS: ${{ vars.RAKUTEN_COPY_AUTO_SHOPS }}
      COPY_IMPROVEMENT_ENABLED: "true"
      COPY_LIVE_MIN_OPPORTUNITY_SCORE: "35"
      COPY_LIVE_CONFIDENCE_THRESHOLD: "0.90"
      COPY_LIVE_MIN_COMMERCIAL_DELTA: "10"
      COPY_LIVE_COOLDOWN_DAYS: "7"
      LISTING_COPY_MODEL: deepseek-chat
      LISTING_DEEPSEEK_TIMEOUT_MS: "120000"
      LISTING_DEEPSEEK_MAX_TOKENS: "1800"

    steps:
      - name: Checkout released source
        uses: actions/checkout@v4

      - name: Resolve bounded run settings
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "schedule" ]]; then
            mode=auto
            limit=1
          else
            mode="${{ inputs.mode }}"
            limit="${{ inputs.limit }}"
          fi
          if [[ "$mode" != "dry_run" && "$mode" != "auto" ]]; then
            echo "mode must be dry_run or auto"
            exit 1
          fi
          if ! [[ "$limit" =~ ^[1-5]$ ]]; then
            echo "limit must be between 1 and 5"
            exit 1
          fi
          test -n "$SUPABASE_PROJECT_REF"
          test -n "$DEEPSEEK_API_KEY"
          if [[ "$mode" == "auto" ]]; then
            test -n "$INTERNAL_CATALOG_API_TOKEN"
            test -n "$COPY_IMPROVEMENT_AUTO_SHOPS"
          fi
          echo "LOOP_MODE=$mode" >> "$GITHUB_ENV"
          echo "LOOP_LIMIT=$limit" >> "$GITHUB_ENV"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: 2.109.1

      - name: Resolve ephemeral server-side database access
        shell: bash
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          test -n "$SUPABASE_ACCESS_TOKEN"
          api_keys="$(supabase projects api-keys \
            --project-ref "$SUPABASE_PROJECT_REF" \
            --reveal \
            --output json)"
          service_role_key="$(jq -r '[.[] | select(.name == "service_role")][0].api_key // empty' <<<"$api_keys")"
          test -n "$service_role_key"
          echo "::add-mask::$service_role_key"
          echo "SUPABASE_URL=https://${SUPABASE_PROJECT_REF}.supabase.co" >> "$GITHUB_ENV"
          echo "SUPABASE_SERVICE_ROLE_KEY=$service_role_key" >> "$GITHUB_ENV"

      - name: Run bounded DeepSeek copy loop
        shell: bash
        run: |
          npx tsx src/jobs/run-generic-copy-canary.ts \
            "--mode=$LOOP_MODE" \
            "--limit=$LOOP_LIMIT" \
            --compact
